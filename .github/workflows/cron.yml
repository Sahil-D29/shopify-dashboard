name: Production Cron

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
    - cron: '*/10 * * * *'
    - cron: '*/15 * * * *'
    - cron: '0 */6 * * *'
    - cron: '30 3 * * *'

permissions:
  contents: read

env:
  APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
  CRON_SECRET: ${{ secrets.CRON_SECRET }}

jobs:
  every-5-minutes:
    name: Every 5 minutes
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '*/5 * * * *'
    runs-on: ubuntu-latest
    steps:
      - name: Run campaign, journey, and email campaign cron
        run: |
          set -euo pipefail
          test -n "$APP_BASE_URL"
          test -n "$CRON_SECRET"

          curl --fail --show-error --silent --max-time 55 --header "Authorization: Bearer $CRON_SECRET" "$APP_BASE_URL/api/cron/campaign-runner"
          curl --fail --show-error --silent --max-time 55 --header "Authorization: Bearer $CRON_SECRET" "$APP_BASE_URL/api/cron/journey-runner"
          curl --fail --show-error --silent --max-time 55 --header "Authorization: Bearer $CRON_SECRET" "$APP_BASE_URL/api/cron/email-campaign-runner"

  every-10-minutes:
    name: Every 10 minutes
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '*/10 * * * *'
    runs-on: ubuntu-latest
    steps:
      - name: Run campaign follow-up cron
        run: |
          set -euo pipefail
          test -n "$APP_BASE_URL"
          test -n "$CRON_SECRET"

          curl --fail --show-error --silent --max-time 55 --header "Authorization: Bearer $CRON_SECRET" "$APP_BASE_URL/api/cron/campaign-followups"

  every-15-minutes:
    name: Every 15 minutes
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '*/15 * * * *'
    runs-on: ubuntu-latest
    steps:
      - name: Run email cross-sell cron
        run: |
          set -euo pipefail
          test -n "$APP_BASE_URL"
          test -n "$CRON_SECRET"

          curl --fail --show-error --silent --max-time 55 --header "Authorization: Bearer $CRON_SECRET" "$APP_BASE_URL/api/cron/email-cross-sell-runner"

  every-6-hours:
    name: Every 6 hours
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 */6 * * *'
    runs-on: ubuntu-latest
    steps:
      - name: Run Shopify token check cron
        run: |
          set -euo pipefail
          test -n "$APP_BASE_URL"
          test -n "$CRON_SECRET"

          curl --fail --show-error --silent --max-time 55 --header "Authorization: Bearer $CRON_SECRET" "$APP_BASE_URL/api/cron/shopify-token-check"

  daily:
    name: Daily
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '30 3 * * *'
    runs-on: ubuntu-latest
    steps:
      - name: Run payment reminders cron
        run: |
          set -euo pipefail
          test -n "$APP_BASE_URL"
          test -n "$CRON_SECRET"

          curl --fail --show-error --silent --max-time 55 --header "Authorization: Bearer $CRON_SECRET" "$APP_BASE_URL/api/cron/payment-reminders"
